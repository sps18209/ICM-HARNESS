name: ci
on: [push, pull_request]

jobs:
  typescript-target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fixtures/typescript_api/package-lock.json
      - run: python -m pip install -c requirements/dev.lock -e ".[dev]"
      - run: npm ci --ignore-scripts --prefix fixtures/typescript_api
      - run: npx --prefix fixtures/typescript_api playwright install --with-deps --only-shell chromium
      - run: python scripts/verify_typescript_fixture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-acceptance-evidence
          path: |
            .harness/runtime/typescript-validation
            .harness/runtime/browser-qa
          include-hidden-files: true
          if-no-files-found: ignore

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -c requirements/dev.lock -e ".[dev]"
      # Full suite, including the integration suites (integrations adapters,
      # the fake-codex agent path). The live-codex worktree smoke auto-skips
      # unless ICM_SMOKE_CODEX=1 and `codex` is installed.
      - run: python scripts/verify_project.py
      - run: python -m compileall -q src tests

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The extension integration test spawns a real `icm serve`, so the
      # harness must be importable by the interpreter it launches.
      - run: python -m pip install -c requirements/dev.lock -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install extension dependencies
        working-directory: extension
        run: npm ci
      - name: Type-check and run extension tests (logic, API mock, live server)
        working-directory: extension
        env:
          ICM_TEST_PYTHON: python
        run: npm test
      - name: Package the extension (.vsix)
        working-directory: extension
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: icm-harness-vsix
          path: extension/icm-harness.vsix
          if-no-files-found: error
