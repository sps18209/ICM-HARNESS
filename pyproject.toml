[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icm-production-harness"
version = "0.1.0"
description = "Filesystem-first, mode-driven AI engineering harness"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["anyio>=4.4"]

[project.urls]
Homepage = "https://github.com/sps18209/ICM-HARNESS"
Repository = "https://github.com/sps18209/ICM-HARNESS.git"
Issues = "https://github.com/sps18209/ICM-HARNESS/issues"

[project.optional-dependencies]
ai = ["pydantic>=2.7", "pydantic-ai>=1.0", "pydantic-ai-harness>=0.1"]
ml = ["river>=0.22"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
icm = "icm_harness.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.setuptools.package-data]
"icm_harness" = ["defaults.toml", "templates/workspace/**/*"]
"icm_harness.web" = ["static/*"]
