[runtime]
state_db = ".harness/runtime/state.sqlite3"
audit_log = ".harness/runtime/audit.jsonl"
lease_ttl_seconds = 90
heartbeat_seconds = 20
stage_timeout_seconds = 1800
global_concurrency = 8
max_attempts = 3
max_stage_transitions = 100

[context]
base_budget_tokens = 1800
max_budget_tokens = 24000
max_tier = 4

[agent]
provider = "codex-cli"
executable = "codex"
model = "default"
extra_args = []
inherit_environment = ["PATH", "LANG", "LC_ALL", "TERM", "TMPDIR", "USER", "HOME", "CODEX_HOME"]

[workspace]
strategy = "worktree"
worktree_root = ".harness/worktrees"

[web]
host = "127.0.0.1"
port = 8765
poll_interval_ms = 1500

[models.default]
provider = "codex-cli"
family = "codex"
max_context = 200000
input_cost_per_million = 0.0
output_cost_per_million = 0.0
latency_ms = 1000
reliability = 0.90
quality_prior = 0.80
capabilities = ["text", "code", "tools"]
privacy_class = 0

[stage_budgets]
"quick.execute" = 2500
"quick.verify" = 2500
"quick.close" = 1800
"discovery.frame" = 3500
"discovery.explore" = 5000
"discovery.research" = 14000
"discovery.adversarial" = 9000
"discovery.synthesis" = 7000
"discovery.validate" = 6000
"build.planner" = 9000
"build.writer" = 7000
"build.tester" = 8500
"build.close" = 3000
"decision.frame" = 3500
"decision.evidence" = 12000
"decision.options" = 6000
"decision.adversarial" = 8000
"decision.decide" = 5000
"decision.validate" = 6000
"decision.close" = 3000
"review.ingest" = 3000
"review.reconstruct" = 6000
"review.inspect" = 9000
"review.adversarial" = 7000
"review.findings" = 6000
